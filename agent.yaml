# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: clinical-trials-search
description: |
    VA clinical-trials search agent — finds recruiting ClinicalTrials.gov studies, checks eligibility, and drafts patient summaries and referral messages.
metadata:
    tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "0.5"
    memory: 1Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5.4-nano
code_configuration:
    runtime: python_3_13
    entry_point: main.py
    dependency_resolution: remote_build
