name: clinical-trials-search
description: >
  VA clinical-trials search agent — finds recruiting ClinicalTrials.gov studies,
  checks eligibility, and drafts patient summaries and referral messages.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
template:
  name: clinical-trials-search
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
resources:
  - kind: model
    id: gpt-5.4-nano
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
